services:
  - type: web
    name: portfolio-pulse
    runtime: python
    plan: free
    autoDeploy: true

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # The app fetches all prices (daily + intraday) on demand from Yahoo Finance,
    # so no background daemons or persistent disk are needed.
    startCommand: bash scripts/start.sh

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Optional password gate for the UI — set the value in the Render dashboard.
      - key: APP_ACCESS_CODE
        sync: false
